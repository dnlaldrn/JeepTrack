name: jeeptrack
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
      - "127.0.0.1:1883:1883" # plain listener: local tests only
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jeeptrack
      POSTGRES_DB: jeeptrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeeptrack -d jeeptrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mosquitto-data:
  db-data:
