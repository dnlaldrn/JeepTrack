<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JeepTrack — Grand Terminal</title>
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { --bg: #0b0f0d; --fg: #f2f5f3; --muted: #9aa49f; --line: #26302b; --brand: #1f8a5b; --warn: #ffd54a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 32px/1.3 system-ui, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; padding: 24px 32px; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 4px solid var(--brand); padding-bottom: 8px; }
    h1 { font-size: 48px; margin: 0; }
    #clock { font-variant-numeric: tabular-nums; color: var(--muted); }
    .banner { background: var(--warn); color: #000; padding: 8px 16px; font-weight: 700; border-radius: 8px; }
    .cols { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; flex: 1; }
    h2 { font-size: 36px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 2px solid var(--line); font-size: 44px; }
    li .min { font-weight: 800; font-variant-numeric: tabular-nums; }
    li.stale { color: var(--muted); }
    .empty, .outbound { color: var(--muted); }
    @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } body { padding: 16px; } }
  </style>
</head>
<body>
  <header><h1>Batangas City Grand Terminal</h1><span id="clock"></span></header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden>Offline — reconnecting…</div>
  <div class="cols">
    <section>
      <h2>Arriving from Alangilan</h2>
      <ol id="inbound" aria-live="polite"><li class="empty">Loading…</li></ol>
    </section>
    <section>
      <h2>Outbound</h2>
      <p class="outbound">Outbound not tracked yet</p>
    </section>
  </div>
  <script type="module" src="/kiosk.js"></script>
</body>
</html>
