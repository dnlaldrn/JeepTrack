<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JeepTrack</title>
  <meta name="description" content="Live jeepney arrivals, Alangilan to Batangas City Grand Terminal">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <h1>JeepTrack <span class="sub">Alangilan → Grand Terminal</span></h1>
    <button id="nearest" type="button">Nearest stop</button>
  </header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden>Offline — reconnecting…</div>
  <main>
    <div id="map" aria-label="Map of the route with live jeepneys"></div>
    <section id="panel" class="panel" aria-live="polite">
      <label for="stop-select" class="note">Stop</label>
      <select id="stop-select"><option value="">Choose a stop…</option></select>
      <h2 id="panel-title">Tap a stop to see arrivals</h2>
      <p id="panel-note" class="note"></p>
      <ul id="etas" class="etas"></ul>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
